name: Relance email abonnés

# Déclenchement manuel uniquement (workflow_dispatch) : contrairement à
# cron-rappel.yml, ce n'est pas une tâche récurrente mais une campagne
# ponctuelle vers /api/admin/relance (voir ce fichier — à retirer après
# l'envoi du 09/10/2026).
on:
  workflow_dispatch:
    inputs:
      debug:
        description: "1 pour tester un seul envoi (diagnostic Brevo) au lieu d'envoyer à tout le monde"
        required: false
        default: ""
      to:
        description: "Email de test (avec debug=1) — par défaut le premier compte trouvé"
        required: false
        default: ""

jobs:
  relance:
    runs-on: ubuntu-latest
    steps:
      - name: Appelle /api/admin/relance
        run: |
          curl --fail --show-error --silent \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://studijur.fr/api/admin/relance?debug=${{ github.event.inputs.debug }}&to=${{ github.event.inputs.to }}"
